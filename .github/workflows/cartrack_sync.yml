name: Cartrack Daily Sync

on:
  schedule:
    # 07:00 Manila (UTC+8) = 23:00 UTC
    - cron: '0 23 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check secrets configured
        env:
          SYNC_URL: ${{ secrets.FLEETPULSE_SYNC_URL }}
          SYNC_TOKEN: ${{ secrets.CARTRACK_SYNC_TOKEN }}
        run: |
          if [ -z "$SYNC_URL" ]; then
            echo "::error::Secret FLEETPULSE_SYNC_URL is not configured. Add it at GitHub repo Settings -> Secrets and variables -> Actions, value = the app's public URL (e.g. https://your-app.example.com/)"
            exit 1
          fi
          case "$SYNC_URL" in
            http://*|https://*) ;;
            *) echo "::error::FLEETPULSE_SYNC_URL must start with http:// or https:// (got: $SYNC_URL)"; exit 1 ;;
          esac
          if [ -z "$SYNC_TOKEN" ]; then
            echo "::error::Secret CARTRACK_SYNC_TOKEN is not configured. Add the same value that is set as the SYNC_TOKEN environment variable on the app server."
            exit 1
          fi
        shell: bash

      - name: Wake app (cold start)
        run: |
          curl -fsS -m 120 "${{ secrets.FLEETPULSE_SYNC_URL }}" \
            || echo "wake curl failed (app may already be up)"
        shell: bash

      - name: Wait for cold boot
        run: sleep 60

      - name: Trigger Cartrack sync
        env:
          SYNC_URL: ${{ secrets.FLEETPULSE_SYNC_URL }}
          SYNC_TOKEN: ${{ secrets.CARTRACK_SYNC_TOKEN }}
        run: |
          url="${SYNC_URL%/}/fleetops/sync/"
          body='{"days_back":7,"data_types":["trips","events","fuel"]}'
          set +e
          for attempt in 1 2 3 4 5; do
            echo "attempt $attempt"
            resp=$(curl -sS -m 240 -w '\n%{http_code}' \
              -X POST "$url" \
              -H "Authorization: Bearer ${SYNC_TOKEN}" \
              -H "Content-Type: application/json" \
              -d "$body" 2>&1)
            rc=$?
            http_code=$(printf '%s' "$resp" | tail -n1)
            payload=$(printf '%s' "$resp" | sed '$d')
            echo "http_code=$http_code (curl exit $rc)"
            if [ "$http_code" = "200" ]; then
              echo "$payload"
              echo "SYNC OK"
              exit 0
            fi
            echo "sync attempt $attempt failed: $payload"
            sleep 60
          done
          echo "::error::All sync attempts failed. Verify the app is publicly reachable at $SYNC_URL and that SYNC_TOKEN plus the CARTRACK_API_* credentials are set in the app's environment."
          exit 1
        shell: bash