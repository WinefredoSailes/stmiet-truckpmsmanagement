<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - FleetPulse</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    {% load static %}
    <link rel="icon" type="image/png" href="{% static 'img/favicon-fleetpulse.png' %}">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body class="login-page">
    <div id="login-loader">
        <img src="{% static 'img/favicon-fleetpulse.png' %}" alt="Loading">
        <span>Logging in...</span>
    </div>
    <div class="login-shell">
        <div class="login-panel">
            <div class="login-brand">
                <i class="bi bi-truck-front-fill login-brand-icon"></i>
                <div>
                    <h4 class="mb-0 fw-bold">FleetPulse</h4>
                    <span class="login-brand-sub">Truck Preventive Maintenance & Servicing</span>
                </div>
            </div>
            <p class="login-panel-quote">
                "Commit to the LORD whatever you do,<br>and He will establish your plans."
            </p>
            <p class="login-panel-cite">— Proverbs 16:3</p>
            <div class="login-logos">
                <img src="{% static 'img/stmiet-trans-logo.png' %}" alt="STMIET" title="STMIET">
                <img src="{% static 'img/stpc-trans-logo.png' %}" alt="STPC" title="STPC">
            </div>
        </div>
        <div class="login-card card">
            <div class="login-header">
                <i class="bi bi-truck-front-fill"></i>
                <h4 class="mt-2 fw-bold">Welcome Back</h4>
                <p class="text-muted small">Sign in to your account</p>
            </div>
            <div class="login-body">
                <form method="post" onsubmit="var f=this;document.getElementById('login-loader').style.display='flex';setTimeout(function(){f.submit()},300);return false">
                    {% csrf_token %}
                    {% if form.errors %}
                    <div class="alert alert-danger py-2 small">
                        Invalid username or password.
                    </div>
                    {% endif %}
                    <div class="mb-3">
                        <label class="form-label small fw-medium">Username</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-person"></i></span>
                            <input type="text" name="username" class="form-control" required autofocus>
                        </div>
                    </div>
                    <div class="mb-4">
                        <label class="form-label small fw-medium">Password</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-lock"></i></span>
                            <input type="password" name="password" class="form-control" required>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 py-2">
                        <i class="bi bi-box-arrow-in-right me-2"></i>Sign In
                    </button>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
